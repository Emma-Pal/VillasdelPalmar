; Límites de subida de archivos — el formulario de "Nuevo colaborador"
; (Directorio) manda hasta 7 archivos en un solo POST (foto + INE + CURP +
; RFC + NSS + comprobante de domicilio + contrato), y cada uno puede pesar
; hasta 10 MB según app/subida.php. Si la suma pasa de post_max_size, PHP
; vacía $_POST por completo (incluido el token CSRF oculto), lo que se veía
; como un falso "tu sesión expiró" sin importar qué tan bien se llenara el
; formulario. post_max_size siempre debe quedar MAYOR que
; upload_max_filesize × (archivos esperados), con margen.
;
; cPanel (PHP-FPM) aplica este archivo solo a esta carpeta y tarda hasta
; unos minutos en recogerlo (user_ini.cache_ttl) — si acabas de subir esto,
; espera un momento antes de volver a probar el formulario.
upload_max_filesize = 12M
post_max_size = 90M
max_file_uploads = 20
max_execution_time = 120
max_input_time = 120

; ===== Endurecimiento de seguridad =====
; Nunca mostrar errores/stack traces de PHP a quien visita el sitio (solo
; importa si el PHP del hosting trae display_errors=On por default — esto
; lo fuerza a Off pase lo que pase). Los errores se siguen registrando en el
; log del servidor con log_errors, nada más dejan de imprimirse en pantalla.
display_errors = Off
log_errors = On

; La cookie de sesión nunca debe poder leerse desde JavaScript (httponly), ni
; mandarse en una petición disparada desde OTRO sitio (samesite=Lax), ni
; viajar nunca por una conexión sin cifrar (secure — confirmado que el sitio
; siempre usa HTTPS, de la mano con el redirect forzado en .htaccess).
session.cookie_httponly = 1
session.cookie_samesite = Lax
session.cookie_secure = 1
